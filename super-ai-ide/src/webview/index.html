<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap"
        rel="stylesheet">
    <style>
        :root {
            /* Anime Pikachu Theme Constants */
            --pikachu-yellow: #FFEB3B;
            --pikachu-dark-yellow: #FBC02D;
            --pikachu-red: #FF5252;
            --pikachu-black: #212121;
            --pikachu-brown: #5D4037;
            --pikachu-lightning: #2979FF;
            --bg-color: #121212;
            --panel-bg: #1E1E1E;
            --text-color: #E0E0E0;
            --border-width: 2px;
            --border-style: solid;
            --border-color: var(--pikachu-yellow);
            --shadow-offset: 4px;
            --shadow-color: rgba(0, 0, 0, 0.8);
            --hard-shadow: 4px 4px 0px #000000;
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 20px;

            /* Compatibility Mappings */
            --gradient-primary: var(--pikachu-yellow);
            --gradient-secondary: linear-gradient(135deg, #FF5252 0%, #D32F2F 100%);
            --gradient-success: #4CAF50;
            --gradient-warning: #FFC107;
            --gradient-error: #F44336;
            --gradient-tool: var(--pikachu-lightning);
            --glass-bg: var(--panel-bg);
            --glass-border: var(--pikachu-yellow);
            --border-radius-md: var(--radius-md);
            --border-radius-lg: var(--radius-lg);
            --vscode-editor-background: var(--bg-color);
            --vscode-editor-foreground: var(--text-color);
            --vscode-font-family: 'Inter', sans-serif;
            --vscode-input-foreground: var(--text-color);
            --vscode-icon-foreground: var(--text-color);
        }

        * {
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', 'Comic Sans MS', 'Chalkboard SE', sans-serif;
            padding: 0;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            color: var(--text-color);
            background: var(--bg-color);
            overflow: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar {
            width: 10px;
            background: var(--bg-color);
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: var(--pikachu-yellow);
            border: 2px solid var(--pikachu-black);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--pikachu-dark-yellow);
        }

        /* General UI */
        .view {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-image:
                radial-gradient(circle at 10% 20%, rgba(255, 235, 59, 0.1) 0%, transparent 20%),
                radial-gradient(circle at 90% 80%, rgba(255, 82, 82, 0.05) 0%, transparent 20%);
        }

        .hidden {
            display: none !important;
        }

        /* Header */
        .header {
            padding: 12px 16px;
            border-bottom: var(--border-width) var(--border-style) var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
            z-index: 10;
        }

        .header-title {
            font-size: 1.2em;
            font-weight: 800;
            color: var(--pikachu-yellow);
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 2px 2px 0px black;
        }

        .header-left {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        /* Session List */
        .session-list {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .session-item {
            padding: 14px 16px;
            margin-bottom: 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--hard-shadow);
            transition: transform 0.1s;
        }

        .session-item:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px var(--pikachu-yellow);
            background: #2C2C2C;
        }

        .session-item-text {
            display: flex;
            align-items: center;
            gap: 10px;
            flex: 1;
            overflow: hidden;
        }

        .session-item-icon {
            font-size: 1.2em;
        }

        .session-item span {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 600;
        }

        .delete-btn {
            background: var(--pikachu-red);
            border: 2px solid black;
            color: white;
            cursor: pointer;
            width: 24px;
            height: 24px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.2s;
            margin-left: 8px;
        }

        .session-item:hover .delete-btn {
            opacity: 1;
        }

        .delete-btn:hover {
            transform: scale(1.1);
        }

        /* Chat Area */
        .messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* Input Group */
        .input-group {
            padding: 20px;
            border-top: var(--border-width) solid var(--border-color);
            display: flex;
            gap: 12px;
            background: var(--panel-bg);
            z-index: 10;
        }

        input {
            flex: 1;
            padding: 12px 16px;
            background: var(--panel-bg);
            color: var(--text-color);
            border: var(--border-width) solid var(--border-color);
            border-radius: var(--radius-md);
            font-size: 1em;
            box-shadow: inset 3px 3px 0px rgba(0, 0, 0, 0.05);
            font-family: inherit;
        }

        input:focus {
            outline: none;
            border-color: var(--pikachu-lightning);
            box-shadow: inset 3px 3px 0px rgba(41, 121, 255, 0.1);
        }

        input::placeholder {
            color: rgba(0, 0, 0, 0.4);
        }

        /* Buttons */
        button {
            padding: 10px 20px;
            background: var(--pikachu-yellow);
            color: black;
            border: var(--border-width) solid var(--border-color);
            cursor: pointer;
            border-radius: var(--radius-md);
            font-weight: 700;
            font-size: 0.95em;
            box-shadow: var(--hard-shadow);
            transition: all 0.1s;
            font-family: inherit;
            text-transform: uppercase;
        }

        button:hover {
            transform: translate(-2px, -2px);
            box-shadow: 6px 6px 0px #000000;
            background: #FFEE58;
        }

        button:active {
            transform: translate(2px, 2px);
            box-shadow: 2px 2px 0px #000000;
        }

        button.secondary {
            background: transparent;
            color: var(--pikachu-yellow);
            border-color: var(--pikachu-yellow);
        }

        button.icon-btn {
            width: 40px;
            height: 40px;
            padding: 0;
            border-radius: 50%;
            background: transparent;
            color: var(--pikachu-yellow);
            border: 2px solid var(--pikachu-yellow);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2em;
        }

        button.icon-btn:hover {
            background: var(--pikachu-yellow);
            color: black;
        }

        /* Messages */
        .message {
            padding: 16px 20px;
            border-radius: var(--radius-lg);
            line-height: 1.6;
            word-wrap: break-word;
            position: relative;
            border: var(--border-width) solid var(--border-color);
            box-shadow: var(--hard-shadow);
            max-width: 85%;
            animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes popIn {
            from {
                opacity: 0;
                transform: scale(0.9) translateY(10px);
            }

            to {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        .message.user {
            align-self: flex-end;
            background: var(--pikachu-yellow);
            color: var(--pikachu-black);
            border-bottom-right-radius: 4px;
        }

        .message.ai {
            align-self: flex-start;
            background: var(--panel-bg);
            border-bottom-left-radius: 4px;
        }

        .message.ai pre {
            background: #212121;
            color: #eee;
            padding: 16px;
            border-radius: var(--radius-sm);
            overflow-x: auto;
            margin: 12px 0;
            border: 2px solid black;
        }

        .message.ai code {
            font-family: 'JetBrains Mono', monospace;
            background: rgba(0, 0, 0, 0.1);
            padding: 2px 4px;
            border-radius: 4px;
            font-size: 0.9em;
        }

        .message.ai pre code {
            background: transparent;
            padding: 0;
            color: inherit;
        }

        .message.ai a {
            color: var(--pikachu-lightning);
            font-weight: bold;
        }

        .message.ai blockquote {
            border-left: 4px solid var(--pikachu-yellow);
            padding-left: 12px;
            margin: 8px 0;
            color: #555;
        }

        /* Tool Call Cards */
        .tool-call-card {
            background: #263238;
            border: 2px solid var(--pikachu-lightning);
            border-radius: var(--radius-md);
            margin: 20px 0;
            overflow: hidden;
            box-shadow: 4px 4px 0px var(--pikachu-lightning);
        }

        .tool-call-header {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px 16px;
            background: var(--pikachu-lightning);
            color: white;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        .tool-call-header:hover {
            background: #1976D2;
        }

        .tool-call-card.expanded .tool-call-header {
            border-bottom: 2px solid white;
        }

        .tool-call-info {
            flex: 1;
        }

        .tool-call-icon {
            background: white;
            color: var(--pikachu-lightning);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid white;
            font-size: 1.1em;
            flex-shrink: 0;
        }

        .tool-call-name {
            color: white;
            text-transform: uppercase;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9em;
        }

        .tool-call-status {
            font-size: 0.75em;
            color: rgba(255, 255, 255, 0.8);
            margin-top: 2px;
        }

        .tool-call-body {
            display: none;
            background: #37474F;
            color: #ECEFF1;
        }

        .tool-call-card.expanded .tool-call-body {
            display: block;
        }

        .tool-call-section {
            padding: 12px 16px;
            border-bottom: 1px solid #eee;
        }

        .tool-call-section-title {
            font-size: 0.75em;
            font-weight: 800;
            text-transform: uppercase;
            color: #999;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .tool-call-code {
            background: #111;
            border: 2px solid #555;
            color: #DDD;
            padding: 10px;
            border-radius: 8px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85em;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 250px;
            overflow-y: auto;
        }

        .tool-result-success .tool-call-section-title {
            color: #4CAF50;
        }

        .tool-result-error .tool-call-section-title {
            color: #F44336;
        }

        .tool-call-spinner {
            width: 14px;
            height: 14px;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-top-color: white;
            border-radius: 50%;
            display: inline-block;
            vertical-align: middle;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* Empty State */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex: 1;
            padding: 40px;
            text-align: center;
            color: #666;
        }

        .empty-state-icon {
            font-size: 5em;
            color: var(--pikachu-yellow);
            filter: drop-shadow(4px 4px 0px rgba(0, 0, 0, 0.5));
            animation: bounce 2s infinite;
            margin-bottom: 20px;
        }

        @keyframes bounce {

            0%,
            20%,
            50%,
            80%,
            100% {
                transform: translateY(0);
            }

            40% {
                transform: translateY(-20px);
            }

            60% {
                transform: translateY(-10px);
            }
        }

        .empty-state-text {
            font-size: 1.5em;
            font-weight: 800;
            color: var(--text-color);
            margin-bottom: 8px;
        }

        .empty-state-hint {
            font-size: 0.9em;
        }

        /* Badges */
        .badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 0.75em;
            text-transform: uppercase;
            border: 2px solid;
            background: white;
        }

        .badge-success {
            color: #4CAF50;
            border-color: #4CAF50;
        }

        .badge-running {
            color: var(--pikachu-lightning);
            border-color: var(--pikachu-lightning);
        }

        /* Command Confirm */
        .command-confirm-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(2px);
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .command-confirm-modal {
            background: #FFF;
            border: 3px solid var(--pikachu-black);
            box-shadow: 8px 8px 0px var(--pikachu-black);
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            padding: 20px;
            animation: popIn 0.2s;
        }

        .command-confirm-header {
            display: flex;
            gap: 16px;
            align-items: center;
            margin-bottom: 20px;
        }

        .command-confirm-icon {
            width: 48px;
            height: 48px;
            background: var(--gradient-warning);
            border: 2px solid black;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5em;
        }

        .command-confirm-title h3 {
            margin: 0;
            font-size: 1.2em;
        }

        .command-confirm-title p {
            margin: 4px 0 0;
            color: #666;
            font-size: 0.9em;
        }

        .command-confirm-code {
            border: 2px solid #ccc;
            background: #f5f5f5;
            color: #333;
            padding: 12px;
            border-radius: 8px;
            font-family: monospace;
            overflow-x: auto;
            margin: 10px 0;
        }

        .command-confirm-actions {
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            margin-top: 20px;
        }

        .command-confirm-actions .btn-confirm {
            background: #4CAF50;
            color: white;
            border-color: #2E7D32;
        }

        .command-confirm-actions .btn-reject {
            background: var(--pikachu-red);
            color: white;
            border-color: #C62828;
        }

        /* Tags */
        .message-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 10px;
        }

        .message-tag {
            background: white;
            border: 2px solid var(--pikachu-black);
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 0.75em;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 4px;
            box-shadow: 2px 2px 0px rgba(0, 0, 0, 0.1);
        }

        .message-tag-remove {
            cursor: pointer;
            color: #999;
        }

        .message-tag-remove:hover {
            color: red;
        }

        .add-tag-btn {
            background: rgba(0, 0, 0, 0.05);
            border: 1px dashed #999;
            border-radius: 12px;
            padding: 2px 8px;
            cursor: pointer;
            font-size: 0.75em;
            color: #666;
        }

        .add-tag-btn:hover {
            background: rgba(0, 0, 0, 0.1);
            color: #333;
        }

        .tag-input {
            width: 100px;
            padding: 2px 6px;
            font-size: 0.8em;
            border-width: 1px;
        }

        /* History Header */
        .history-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        /* SVG Icons */
        .icon-svg {
            width: 1.2em;
            height: 1.2em;
            display: inline-block;
            vertical-align: middle;
            stroke-width: 2.5;
        }

        .btn-text-icon {
            margin-right: 6px;
        }
    </style>
</head>

<body>
    <div id="chat-view" class="view">
        <div class="header">
            <div class="header-left">
                <button id="historyBtn" class="secondary" title="View History">
                    <svg class="icon-svg btn-text-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20h9" />
                        <path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z" />
                    </svg> History
                </button>
                <button id="newSessionBtn" class="icon-btn" title="New Chat">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="12" y1="5" x2="12" y2="19"></line>
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                    </svg>
                </button>
            </div>
            <button id="settingsBtn" class="icon-btn" title="Settings">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                    stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path
                        d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                    </path>
                </svg>
            </button>
        </div>
        <div class="messages" id="messages">
            <div class="empty-state" id="emptyState">
                <div class="empty-state-icon">
                    <svg style="width: 1em; height: 1em;" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                        stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="11" width="18" height="10" rx="2"></rect>
                        <circle cx="12" cy="5" r="2"></circle>
                        <path d="M12 7v4"></path>
                        <line x1="8" y1="16" x2="8.01" y2="16"></line>
                        <line x1="16" y1="16" x2="16.01" y2="16"></line>
                    </svg>
                </div>
                <div class="empty-state-text">Start a conversation</div>
                <div class="empty-state-hint">Ask me anything about your code...</div>
            </div>
        </div>
        <div class="input-group">
            <button id="undoBtn" class="secondary" title="Undo Last Interaction"
                style="padding: 0 14px; font-size: 1.2em;">
                <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                    stroke-linejoin="round">
                    <path d="M3 7v6h6" />
                    <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13" />
                </svg>
            </button>
            <input type="text" id="userInput" placeholder="Ask AI something amazing..." />
            <button id="sendBtn">
                Send <svg class="icon-svg" style="margin-left: 4px;" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <div id="history-view" class="view hidden">
        <div class="header">
            <div class="history-header" style="width: 100%;">
                <button id="backBtn" class="icon-btn" title="Back">
                    <svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"
                        stroke-linejoin="round">
                        <line x1="19" y1="12" x2="5" y2="12"></line>
                        <polyline points="12 19 5 12 12 5"></polyline>
                    </svg>
                </button>
                <span class="header-title">Chat History</span>
            </div>
        </div>
        <div class="session-list" id="sessionList"></div>
    </div>

    <script>
        const vscode = acquireVsCodeApi();
        const md = window.markdownit({
            html: true,
            breaks: true,
            linkify: true
        });

        // DOM Elements
        const chatView = document.getElementById('chat-view');
        const historyView = document.getElementById('history-view');
        const sessionList = document.getElementById('sessionList');
        const messagesDiv = document.getElementById('messages');
        const userInput = document.getElementById('userInput');
        const sendBtn = document.getElementById('sendBtn');
        const newSessionBtn = document.getElementById('newSessionBtn');
        const historyBtn = document.getElementById('historyBtn');
        const backBtn = document.getElementById('backBtn');
        const settingsBtn = document.getElementById('settingsBtn');
        const undoBtn = document.getElementById('undoBtn');
        const emptyState = document.getElementById('emptyState');

        // State
        let currentAiMessageDiv = null;
        let currentAiMessageContent = "";
        let pendingToolCalls = new Map(); // Store pending tool calls by ID

        // Initialize
        vscode.postMessage({ type: 'init' });

        // Navigation Events
        historyBtn.addEventListener('click', () => {
            chatView.classList.add('hidden');
            historyView.classList.remove('hidden');
        });

        backBtn.addEventListener('click', () => {
            historyView.classList.add('hidden');
            chatView.classList.remove('hidden');
        });

        settingsBtn.addEventListener('click', () => {
            vscode.postMessage({ type: 'openSettings' });
        });

        undoBtn.addEventListener('click', () => {
            vscode.postMessage({ type: 'undoLastMessage' });
        });

        newSessionBtn.addEventListener('click', () => {
            vscode.postMessage({ type: 'createSession' });
            historyView.classList.add('hidden');
            chatView.classList.remove('hidden');
        });

        // Send Message
        function sendMessage() {
            const text = userInput.value.trim();
            if (text) {
                hideEmptyState();
                addMessage(text, 'user');
                userInput.value = '';
                vscode.postMessage({ type: 'askAI', text: text });
            }
        }

        sendBtn.addEventListener('click', sendMessage);

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                sendMessage();
            }
        });

        // Helper Functions
        function hideEmptyState() {
            if (emptyState) {
                emptyState.style.display = 'none';
            }
        }

        function showEmptyState() {
            if (emptyState && messagesDiv.children.length <= 1) {
                emptyState.style.display = 'flex';
            }
        }

        function formatJSON(obj) {
            try {
                if (typeof obj === 'string') {
                    // Try to parse if it's a JSON string
                    try {
                        obj = JSON.parse(obj);
                    } catch {
                        return obj;
                    }
                }
                return JSON.stringify(obj, null, 2);
            } catch {
                return String(obj);
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Message Handler
        window.addEventListener('message', event => {
            const message = event.data;
            switch (message.type) {
                case 'updateSessions':
                    renderSessions(message.value);
                    break;
                case 'loadChat':
                    renderChat(message.value);
                    break;
                case 'startStream':
                    hideEmptyState();
                    currentAiMessageContent = "";
                    currentAiMessageDiv = document.createElement('div');
                    currentAiMessageDiv.className = 'message ai';
                    messagesDiv.appendChild(currentAiMessageDiv);
                    messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    break;
                case 'chunk':
                    if (currentAiMessageDiv) {
                        currentAiMessageContent += message.value;
                        currentAiMessageDiv.innerHTML = parseAndRenderContent(currentAiMessageContent);
                        messagesDiv.scrollTop = messagesDiv.scrollHeight;
                    }
                    break;
                case 'endStream':
                    currentAiMessageDiv = null;
                    break;
                case 'addResponse':
                    hideEmptyState();
                    addMessage(message.value, 'ai');
                    break;
                case 'commandConfirm':
                    showCommandConfirmDialog(message.id, message.command, message.cwd);
                    break;
                case 'requestPermission':
                    showPermissionConfirm(message.id, message.request, message.dryRun);
                    break;
            }
        });

        // Render Functions
        function renderSessions(sessions) {
            sessionList.innerHTML = '';
            if (sessions.length === 0) {
                sessionList.innerHTML = `
                    <div class="empty-state" style="height: auto; padding: 60px 20px;">
                        <div class="empty-state-icon">📭</div>
                        <div class="empty-state-text">No conversations yet</div>
                        <div class="empty-state-hint">Start a new chat to begin</div>
                    </div>
                `;
                return;
            }

            sessions.forEach(session => {
                const div = document.createElement('div');
                div.className = 'session-item';

                const textDiv = document.createElement('div');
                textDiv.className = 'session-item-text';

                const icon = document.createElement('span');
                icon.className = 'session-item-icon';
                // Simple Pikachu Face Icon
                icon.innerHTML = '<svg class="icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M3 2l6 6"/><path d="M21 2l-6 6"/><circle cx="9" cy="13" r="1" fill="currentColor" opacity="0.8"/><circle cx="15" cy="13" r="1" fill="currentColor" opacity="0.8"/><path d="M10 17c1 .5 3 .5 4 0"/></svg>';

                const span = document.createElement('span');
                span.innerText = session.name;

                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '×';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    vscode.postMessage({ type: 'deleteSession', id: session.id });
                };

                div.onclick = () => {
                    vscode.postMessage({ type: 'selectSession', id: session.id });
                    historyView.classList.add('hidden');
                    chatView.classList.remove('hidden');
                };

                textDiv.appendChild(icon);
                textDiv.appendChild(span);
                div.appendChild(textDiv);
                div.appendChild(delBtn);
                sessionList.appendChild(div);
            });
        }

        function renderChat(session) {
            messagesDiv.innerHTML = '';

            // Re-add empty state element
            const newEmptyState = document.createElement('div');
            newEmptyState.className = 'empty-state';
            newEmptyState.id = 'emptyState';
            newEmptyState.innerHTML = `
                <div class="empty-state-icon">
                    <!-- Simple Pikachu Face Icon (Large) -->
                    <svg style="width: 1em; height: 1em;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18z"/><path d="M3 2l6 6"/><path d="M21 2l-6 6"/><circle cx="9" cy="12" r="1.5" fill="currentColor" opacity="0.8" stroke="none"/><circle cx="15" cy="12" r="1.5" fill="currentColor" opacity="0.8" stroke="none"/><path d="M10 16c1 .5 3 .5 4 0"/></svg>
                </div>
                <div class="empty-state-text">Start a conversation</div>
                <div class="empty-state-hint">Ask me anything about your code...</div>
            `;
            messagesDiv.appendChild(newEmptyState);

            if (session.messages.length === 0) {
                newEmptyState.style.display = 'flex';
            } else {
                newEmptyState.style.display = 'none';
                session.messages.forEach(msg => {
                    addMessage(msg.content, msg.role === 'user' ? 'user' : 'ai', msg.id, msg.tags);
                });
            }
        }

        function addMessage(text, type, id, tags) {
            hideEmptyState();
            const msg = document.createElement('div');
            msg.className = 'message ' + type;
            if (type === 'ai') {
                msg.innerHTML = parseAndRenderContent(text);
            } else {
                msg.innerText = text;
            }

            // Render tags/actions only if we have an ID (persisted message)
            if (id) {
                const tagsContainer = document.createElement('div');
                tagsContainer.className = 'message-tags';

                if (tags && tags.length > 0) {
                    tags.forEach(tag => {
                        const tagEl = document.createElement('span');
                        tagEl.className = 'message-tag';
                        tagEl.innerHTML = `#${tag} <span class="message-tag-remove">×</span>`;
                        tagEl.querySelector('.message-tag-remove').onclick = () => {
                            vscode.postMessage({ type: 'removeTag', messageId: id, tag: tag });
                        };
                        tagsContainer.appendChild(tagEl);
                    });
                }

                const addTagBtn = document.createElement('button');
                addTagBtn.className = 'add-tag-btn';
                addTagBtn.innerText = '+ Tag';
                addTagBtn.onclick = () => {
                    addTagBtn.style.display = 'none';
                    const input = document.createElement('input');
                    input.className = 'tag-input';
                    input.placeholder = 'Tag...';
                    input.onkeydown = (e) => {
                        if (e.key === 'Enter') {
                            const tag = input.value.trim();
                            if (tag) {
                                vscode.postMessage({ type: 'addTag', messageId: id, tag: tag });
                            }
                            cleanup();
                        } else if (e.key === 'Escape') {
                            cleanup();
                        }
                    };
                    input.onblur = cleanup;

                    function cleanup() {
                        input.remove();
                        addTagBtn.style.display = 'inline-block';
                    }

                    tagsContainer.appendChild(input);
                    input.focus();
                };
                tagsContainer.appendChild(addTagBtn);

                // Fork Button
                const forkBtn = document.createElement('button');
                forkBtn.className = 'add-tag-btn';
                forkBtn.innerHTML = '🔀 Fork';
                forkBtn.title = 'Create a new session starting from here';
                forkBtn.style.marginLeft = '4px';
                forkBtn.onclick = () => {
                    vscode.postMessage({ type: 'forkSession', messageId: id });
                };
                tagsContainer.appendChild(forkBtn);

                msg.appendChild(tagsContainer);
            }

            messagesDiv.appendChild(msg);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        // Parse tool call markdown and convert to UI components
        function parseAndRenderContent(content) {
            const toolStartPattern = /🔧 \*\*Calling Tool: ([^*]+)\*\*\n```json\n([\s\S]*?)```/g;
            const toolResultPattern = /📋 \*\*Result:\*\*\n```json\n([\s\S]*?)```/g;

            if (content.includes('🔧 **Calling Tool:')) {
                let processedContent = content;
                let toolCalls = [];
                let match;
                while ((match = toolStartPattern.exec(content)) !== null) {
                    toolCalls.push({
                        fullMatch: match[0],
                        toolName: match[1],
                        toolInput: match[2].trim(),
                        index: match.index
                    });
                }
                let results = [];
                while ((match = toolResultPattern.exec(content)) !== null) {
                    results.push({
                        fullMatch: match[0],
                        result: match[1].trim(),
                        index: match.index
                    });
                }

                let html = '';
                let lastIndex = 0;

                for (let i = 0; i < toolCalls.length; i++) {
                    const tc = toolCalls[i];
                    const textBefore = content.substring(lastIndex, tc.index);
                    if (textBefore.trim()) {
                        html += md.render(textBefore);
                    }

                    const result = results[i];
                    let inputFormatted = tc.toolInput;
                    try {
                        inputFormatted = JSON.stringify(JSON.parse(tc.toolInput), null, 2);
                    } catch { }

                    const hasResult = result && result.result;
                    const resultFormatted = hasResult ? result.result : '';

                    html += `
                        <div class="tool-call-card expanded">
                            <div class="tool-call-header" onclick="this.parentElement.classList.toggle('expanded')">
                                <div class="tool-call-icon">
                                    <svg class="icon-svg" style="width: 18px; height: 18px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"></path></svg>
                                </div>
                                <div class="tool-call-info">
                                    <div class="tool-call-name">${escapeHtml(tc.toolName)}</div>
                                    <div class="tool-call-status">
                                        ${hasResult
                            ? '<span class="badge badge-success">✓ Complete</span>'
                            : '<span class="badge badge-running"><span class="tool-call-spinner"></span> Running...</span>'
                        }
                                    </div>
                                </div>
                                <div class="tool-call-toggle">▼</div>
                            </div>
                            <div class="tool-call-body">
                                <div class="tool-call-section">
                                    <div class="tool-call-section-title">
                                        <span class="icon">
                                            <svg class="icon-svg" style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><polyline points="19 12 12 19 5 12"></polyline></svg>
                                        </span>
                                        Input Parameters
                                    </div>
                                    <div class="tool-call-code">${escapeHtml(inputFormatted)}</div>
                                </div>
                                ${hasResult ? `
                                <div class="tool-call-section tool-result-success">
                                    <div class="tool-call-section-title">
                                        <span class="icon">
                                            <svg class="icon-svg" style="width: 14px; height: 14px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>
                                        </span>
                                        Output Result
                                    </div>
                                    <div class="tool-call-code">${escapeHtml(resultFormatted)}</div>
                                </div>
                                ` : ''}
                            </div>
                        </div>
                    `;

                    if (result) {
                        lastIndex = result.index + result.fullMatch.length;
                    } else {
                        lastIndex = tc.index + tc.fullMatch.length;
                    }
                }

                const textAfter = content.substring(lastIndex);
                if (textAfter.trim()) {
                    html += md.render(textAfter);
                }
                return html;
            }
            return md.render(content);
        }

        /**
         * 显示命令确认对话框 (Legacy)
         */
        function showCommandConfirmDialog(id, command, cwd) {
            const existing = document.querySelector('.command-confirm-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.className = 'command-confirm-overlay';
            overlay.innerHTML = `
                <div class="command-confirm-modal">
                    <div class="command-confirm-header">
                        <div class="command-confirm-icon">
                            <svg class="icon-svg" style="width: 28px; height: 28px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                        </div>
                        <div class="command-confirm-title">
                            <h3>Terminal Command</h3>
                            <p>AI wants to execute a command. Please review and confirm.</p>
                        </div>
                    </div>
                    <div class="command-confirm-body">
                        <div class="command-confirm-label">
                            <span>
                                <svg class="icon-svg" style="width: 16px; height: 16px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><polyline points="4 17 10 11 4 5"></polyline><line x1="12" y1="19" x2="20" y2="19"></line></svg>
                            </span> Command
                        </div>
                        <div class="command-confirm-code">${escapeHtml(command)}</div>
                        ${cwd ? `<div class="command-confirm-cwd">Working directory: <span>${escapeHtml(cwd)}</span></div>` : ''}
                    </div>
                    <div class="command-confirm-actions">
                        <button class="btn-reject" id="cmd-reject-${id}">✗ Reject</button>
                        <button class="btn-confirm" id="cmd-confirm-${id}">✓ Run Command</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);
            document.getElementById(`cmd-reject-${id}`).addEventListener('click', () => {
                overlay.remove();
                vscode.postMessage({ type: 'commandConfirmResponse', id: id, confirmed: false });
            });
            document.getElementById(`cmd-confirm-${id}`).addEventListener('click', () => {
                overlay.remove();
                vscode.postMessage({ type: 'commandConfirmResponse', id: id, confirmed: true });
            });
        }

        /**
         * 显示权限确认对话框 (New)
         */
        function showPermissionConfirm(id, request, dryRunMarkdown) {
            const existing = document.querySelector('.command-confirm-overlay');
            if (existing) existing.remove();

            const overlay = document.createElement('div');
            overlay.className = 'command-confirm-overlay';

            const dryRunHtml = md.render(dryRunMarkdown);

            overlay.innerHTML = `
                <div class="command-confirm-modal" style="max-width: 600px;">
                    <div class="command-confirm-header">
                        <div class="command-confirm-icon">🛡️</div>
                        <div class="command-confirm-title">
                            <h3>Permission Required</h3>
                            <p>The AI wants to perform a sensitive operation.</p>
                        </div>
                    </div>
                    <div class="command-confirm-body">
                         <div style="background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; margin-bottom: 10px; font-size: 0.9em;">
                            <strong>Tool:</strong> <code>${escapeHtml(request.toolName)}</code><br>
                            <strong>Reason:</strong> ${escapeHtml(request.reason)}
                        </div>
                        <div class="command-confirm-label">
                            <span>🔍</span> Operation Preview (Dry Run)
                        </div>
                        <div style="max-height: 200px; overflow-y: auto; background: rgba(0,0,0,0.2); padding: 10px; border-radius: 4px; font-size: 0.9em;">
                            ${dryRunHtml}
                        </div>
                    </div>
                    <div class="command-confirm-actions">
                        <button class="btn-reject" id="perm-reject-${id}">✗ Deny</button>
                        <button class="btn-confirm" id="perm-confirm-${id}">✓ Approve</button>
                    </div>
                </div>
            `;

            document.body.appendChild(overlay);

            document.getElementById(`perm-reject-${id}`).addEventListener('click', () => {
                overlay.remove();
                vscode.postMessage({ type: 'permissionResponse', id, granted: false });
            });
            document.getElementById(`perm-confirm-${id}`).addEventListener('click', () => {
                overlay.remove();
                vscode.postMessage({ type: 'permissionResponse', id, granted: true });
            });
        }
    </script>
</body>
